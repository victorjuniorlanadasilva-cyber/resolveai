services:
  - type: web
    name: resolveai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://resolveai-2b1g.onrender.com
      - key: APP_URL
        value: https://resolveai-2b1g.onrender.com
      - key: BACKEND_URL
        value: https://resolveai-2b1g.onrender.com
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
